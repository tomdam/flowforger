name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed, so this is `npm install` rather than `npm ci`.
      #
      # Retried because keytar (a hard dependency of @azure/msal-node-extensions)
      # downloads a prebuilt binary at install time; when that download times out
      # it falls back to node-gyp, which needs the libsecret headers we deliberately
      # do not install on Ubuntu (see the bundle check below). A transient timeout
      # must not fail the run.
      - name: Install
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "npm install failed (attempt $attempt of 3); retrying in 30s"
            rm -rf node_modules
            sleep 30
          done
          exit 1

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:ci

      # A tree-shaken expression function registry fails neither the build nor
      # the tests — every expression would silently evaluate to its own source
      # text. The script guards the shipped bundle directly; `npm run ci:local`
      # runs the same check.
      #
      # Do NOT install libsecret on the Ubuntu runner: its absence is what makes
      # this step also prove the CLI starts on Linux without it (0.3.0 crashed
      # on startup there because keytar was loaded eagerly).
      - name: Check CLI bundle keeps the expression registry
        run: node scripts/check-cli-bundle.mjs

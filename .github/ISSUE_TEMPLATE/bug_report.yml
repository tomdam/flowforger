name: Bug report
description: Something doesn't work, or behaves differently locally than in Power Automate
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please redact** tenant URLs, emails, GUIDs of real environments and anything that looks like a token before posting.
        Security problems go to contact@flowforger.net instead — see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI — run (local engine / connectors)
        - CLI — compile / push / generate-dsl / validate
        - DSL (TypeScript → IR)
        - Expressions
        - VS Code extension (editor, diagnostics, completions)
        - VS Code extension (debugger)
        - MCP debug server
        - AI agent skills
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `flowforger --version` and/or the VS Code extension version
      placeholder: "flowforger 0.3.0 / extension 0.3.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest `.ff.ts`, IR, or `clientdata.json` that shows the problem, plus the exact command you ran.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What did you expect, and what happened instead? Paste the full error or `flowforger run --json` output.
    validations:
      required: true
  - type: textarea
    id: cloud
    attributes:
      label: Behaviour in Power Automate / Logic Apps (if relevant)
      description: If the flow behaves differently in the cloud, what does the cloud run show?
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Node 22.20, VS Code 1.104"
